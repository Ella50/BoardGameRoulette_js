<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Társasjáték Rulett</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Fő konténer */
        .container {
            background: rgba(0,0,0,0.5);
            border-radius: 60px;
            padding: 20px 20px 30px;
            backdrop-filter: blur(3px);
            box-shadow: 0 20px 35px rgba(0,0,0,0.4);
            max-width: 700px;
            width: 100%;
        }

        /* Rulett keret */
        .wheel-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        canvas {
            background: #2c1a12;
            border-radius: 50%;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5), inset 0 0 0 5px #e9c891, inset 0 0 0 12px #b87c3a;
            max-width: 100%;
            height: auto;
            width: 320px;
            height: 320px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        canvas:active {
            transform: scale(0.98);
        }

        /* Mutató tű */
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-top: 55px solid #ffd966;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4));
            z-index: 5;
        }
        .pointer::after {
   
            position: absolute;
            top: -58px;
            left: -16px;
            font-size: 26px;
            color: #cc9c33;
            transform: scale(0.9);
        }

        /* Vezérlő panel */
        .controls {
            background: #2e241fcc;
            backdrop-filter: blur(8px);
            border-radius: 50px;
            padding: 18px 20px;
            margin-top: 10px;
            text-align: center;
        }

        .player-selector {
            background: #fcf3da;
            padding: 12px 15px;
            border-radius: 60px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .player-selector label {
            font-weight: bold;
            font-size: 1.2rem;
            color: #3b2a1f;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #playerCount {
            font-size: 1.4rem;
            width: 70px;
            text-align: center;
            font-weight: bold;
            background: #fffaec;
            border: 2px solid #b3873a;
            border-radius: 40px;
            padding: 8px 0;
        }

        .stepper {
            display: flex;
            gap: 12px;
        }

        .stepper button {
            background: #5e3a1c;
            border: none;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            width: 45px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.1s linear;
        }
        .stepper button:active {
            background: #2f1e0e;
            transform: scale(0.96);
        }

        .spin-btn {
            background: #e4a022;
            border: none;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 50px;
            color: #2a1c0c;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 6px 0 #7e511f;
            margin-top: 8px;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #7e511f;
        }

        /* Eredmény doboz */
        .result-box {
            margin-top: 20px;
            background: #ffefc0;
            border-radius: 50px;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.5rem;
            color: #2e241f;
            box-shadow: inset 0 0 0 2px #ffe3a3, 0 5px 12px black;
        }

        .game-name {
            font-size: 1.9rem;
            background: #3b2c1c;
            display: inline-block;
            padding: 8px 24px;
            border-radius: 40px;
            color: #ffdd99;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            color: #ddd0b0;
            margin-top: 15px;
        }

        @media (max-width: 550px) {
            canvas {
                width: 260px;
                height: 260px;
            }
            .game-name {
                font-size: 1.3rem;
            }
            .result-box {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="wheel-wrapper">
        <canvas id="wheelCanvas" width="500" height="500"></canvas>
        <div class="pointer"></div>
    </div>

    <div class="controls">
        <div class="player-selector">
            <label>👥 Játékosok száma:</label>
            <div class="stepper">
                <button id="minusBtn">–</button>
                <span id="playerCount">3</span>
                <button id="plusBtn">+</button>
            </div>
        </div>
        <button class="spin-btn" id="spinBtn">🎲 PÖRGETÉS 🎲</button>
        <div class="result-box" id="resultBox">
            🎯 Nyertes játék:
            <div id="gameNameDisplay" class="game-name">?</div>
        </div>
    </div>
   
</div>

<script>
        // ---------- TÁRSASJÁTÉK ADATBÁZIS ----------
    const games = [
        { name: "Aranyásók", minPlayers: 6, maxPlayers: 100 },
        { name: "Dutch", minPlayers: 4, maxPlayers: 100 },
        { name: "Römi", minPlayers: 4, maxPlayers: 100 },
        { name: "Kocsma póker", minPlayers: 4, maxPlayers: 100 },
        { name: "Erdő", minPlayers: 2, maxPlayers: 100 },
        { name: "Alhambra", minPlayers: 2, maxPlayers: 4 },
        { name: "Királyi Combo", minPlayers: 2, maxPlayers: 5 },
        { name: "Hősök kívűl tágasabb", minPlayers: 2, maxPlayers: 5 },
        { name: "Carcassonne", minPlayers: 2, maxPlayers: 5 },
        { name: "Tibet", minPlayers: 2, maxPlayers: 5 },
        { name: "Druida", minPlayers: 2, maxPlayers: 5 },
        { name: "Imhotep", minPlayers: 2, maxPlayers: 5 },
        { name: "Ezüst tó", minPlayers: 2, maxPlayers: 5 },
        { name: "Endevour", minPlayers: 2, maxPlayers: 5 },
        { name: "Tick Tack Bumm", minPlayers: 2, maxPlayers: 100 },
        { name: "A macskák szigete", minPlayers: 2, maxPlayers: 5 },
        { name: "Világ városok", minPlayers: 2, maxPlayers: 5 },
        { name: "Splendor", minPlayers: 2, maxPlayers: 4 },
        { name: "7 Csoda", minPlayers: 2, maxPlayers: 7 },
        { name: "Catan telepesei", minPlayers: 3, maxPlayers: 4 },
        { name: "Solo", minPlayers: 2, maxPlayers: 100 },

    ];

    function getFilteredGames(playerCount) {
        return games.filter(game => playerCount >= game.minPlayers && playerCount <= game.maxPlayers);
    }

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    let currentRotation = 0;
    let spinning = false;
    let animationId = null;
    let spinStartTime = 0;
    let spinDuration = 2000;
    let targetRotation = 0;
    let startRot = 0;
    let deltaRot = 0;

    const colorPalette = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#b2f0b0', '#ff9f68', '#c084fc', '#fbc4ab', '#88d4ab'];

    function drawWheel() {
        const filtered = getFilteredGames(currentPlayerCount);
        if (filtered.length === 0) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#3a2a1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText("Nincs játék", canvas.width/2-60, canvas.height/2);
            return;
        }

        const angleStep = (Math.PI * 2) / filtered.length;
        const radius = canvas.width / 2;
        const centerX = radius;
        const centerY = radius;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        for (let i = 0; i < filtered.length; i++) {
            const startAngle = i * angleStep + currentRotation * Math.PI / 180;
            const endAngle = (i + 1) * angleStep + currentRotation * Math.PI / 180;
            
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.fillStyle = colorPalette[i % colorPalette.length];
            ctx.fill();
            ctx.strokeStyle = '#F1E6C4';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(startAngle + angleStep / 2);
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            let gameShort = filtered[i].name.length > 18 ? filtered[i].name.slice(0,15)+".." : filtered[i].name;
            ctx.font = `bold ${Math.min(14, 220 / filtered.length + 8)}px "Segoe UI"`;
            ctx.fillStyle = "#1e2a1c";
            ctx.fillText(gameShort, radius * 0.65, 5);
            ctx.restore();
        }
        
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius * 0.12, 0, 2 * Math.PI);
        ctx.fillStyle = "#dbb469";
        ctx.fill();
    }

    // FONTOS: Javított kiválasztó logika
    function getCurrentSelectedGame() {
        const filtered = getFilteredGames(currentPlayerCount);
        if (filtered.length === 0) return null;
        
        const angleStep = 360 / filtered.length;
        
        // A pointer fent van (12 óra), ami a canvas koordináta rendszerében -90°-nak felel meg
        // A kerék currentRotation fokkal van elforgatva
        // Azt nézzük, hogy a -90°-os irányba melyik szelet esik
        
        // A pointer iránya a világban: -90° (felfelé)
        const pointerAngle = -90;
        
        // A kerék elfordulása miatt a pointer által mutatott szög a kerék saját koordináta rendszerében:
        const angleOnWheel = (pointerAngle - currentRotation) % 360;
        
        // Ebből számoljuk a szelet indexét
        let idx = Math.floor(angleOnWheel / angleStep);
        // Normalizálás: ha negatív, adjunk hozzá filtered.length-t
        while (idx < 0) idx += filtered.length;
        idx = idx % filtered.length;
        
        return filtered[idx];
    }

    function animateSpin(now) {
        const elapsed = now - spinStartTime;
        let t = Math.min(1, elapsed / spinDuration);
        const easeOut = 1 - Math.pow(1 - t, 3);
        const currentRot = startRot + deltaRot * easeOut;
        currentRotation = currentRot % 360;
        drawWheel();
        
        if (t < 1) {
            animationId = requestAnimationFrame(animateSpin);
        } else {
            currentRotation = targetRotation % 360;
            drawWheel();
            spinning = false;
            const winner = getCurrentSelectedGame();
            const resultDiv = document.getElementById('gameNameDisplay');
            if (winner) {
                resultDiv.innerHTML = `${winner.name}`;
                resultDiv.style.transform = "scale(1.05)";
                setTimeout(() => resultDiv.style.transform = "", 200);
            } else {
                resultDiv.innerHTML = "❌ Nincs elérhető játék ennyi főre! ❌";
            }
            animationId = null;
        }
    }

    let currentPlayerCount = 3;

    function startSpin() {
        if (spinning) return;
        const filteredGamesNow = getFilteredGames(currentPlayerCount);
        if (filteredGamesNow.length === 0) {
            document.getElementById('gameNameDisplay').innerHTML = "⚠️ Nincs játék a megadott létszámhoz! ⚠️";
            return;
        }
        
        const fullTurns = 360 * (5 + Math.floor(Math.random() * 6));
        const randomOffset = Math.random() * 360;
        targetRotation = (currentRotation + fullTurns + randomOffset) % 360;
        startRot = currentRotation;
        deltaRot = (targetRotation - startRot + 360) % 360;
        if (deltaRot === 0) deltaRot = 360;
        
        spinStartTime = performance.now();
        spinning = true;
        animationId = requestAnimationFrame(animateSpin);
        
        document.getElementById('gameNameDisplay').innerHTML = "✨ Pörgetés... ✨";
    }

    function updatePlayerCount(delta) {
        let newVal = currentPlayerCount + delta;
        if (newVal < 1) newVal = 1;
        if (newVal > 12) newVal = 12;
        currentPlayerCount = newVal;
        document.getElementById('playerCount').innerText = currentPlayerCount;
        if (!spinning) {
            drawWheel();
            const anyGame = getFilteredGames(currentPlayerCount).length > 0;
            if (!anyGame) {
                document.getElementById('gameNameDisplay').innerHTML = "❌ Nincs megfelelő játék";
            } else {
                const currentWinner = getCurrentSelectedGame();
                if(currentWinner) document.getElementById('gameNameDisplay').innerHTML = currentWinner.name;
                else document.getElementById('gameNameDisplay').innerHTML = "?";
            }
        }
    }

    document.getElementById('plusBtn').addEventListener('click', () => updatePlayerCount(1));
    document.getElementById('minusBtn').addEventListener('click', () => updatePlayerCount(-1));
    document.getElementById('spinBtn').addEventListener('click', startSpin);
    canvas.addEventListener('click', startSpin);

    const playerSpan = document.getElementById('playerCount');
    playerSpan.innerText = currentPlayerCount;
    
    drawWheel();
    const defaultGame = getCurrentSelectedGame();
    if(defaultGame) document.getElementById('gameNameDisplay').innerHTML = defaultGame.name;
    else document.getElementById('gameNameDisplay').innerHTML = "Válassz létszámot";
</script>
</body>
</html>
